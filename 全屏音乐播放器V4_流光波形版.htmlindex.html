<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全屏音乐播放器 V4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;animation:zoom 12s infinite alternate;transition:opacity 1s}
@keyframes zoom{to{transform:scale(1.1)}}
#shade{position:fixed;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.85))}
.side{position:fixed;top:20%;bottom:20%;width:80px;display:flex;align-items:center}
#l{left:0}#r{right:0}
.wave{width:100%;height:4px;margin:3px;border-radius:10px;background:linear-gradient(90deg,#00ffff,#9b59ff,#ff4da6);box-shadow:0 0 15px #00ffff;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scaleY(4);opacity:.7}}
#lyric{position:fixed;bottom:90px;left:8%;right:8%;font-size:24px;text-align:center;white-space:nowrap;overflow:hidden;text-shadow:0 0 15px #000}
#ui{position:fixed;bottom:20px;left:5%;right:5%;padding:12px;text-align:center;background:#0008;border-radius:25px;transition:.4s}
.hide{opacity:0;pointer-events:none}
.btn{display:inline-block;background:white;color:#000;padding:10px 14px;border-radius:20px;margin:4px}
input{display:none}
</style></head><body>
<img id="bg"><div id="shade"></div>
<div id="l" class="side"></div><div id="r" class="side"></div>
<div id="lyric">请选择音乐</div>
<div id="ui">
<label class="btn" for="music">🎵音乐</label><label class="btn" for="pics">🖼图片</label><label class="btn" for="lrc">📝歌词</label>
<button class="btn" onclick="audio.play()">▶</button><button class="btn" onclick="audio.pause()">⏸</button>
<input id="music" type="file" accept="audio/*"><input id="pics" type="file" accept="image/*" multiple><input id="lrc" type="file" accept=".lrc,.txt">
</div>
<audio id="audio" playsinline></audio>
<script>
const audio=document.querySelector("#audio"),bg=document.querySelector("#bg"),lyric=document.querySelector("#lyric"),ui=document.querySelector("#ui");
music.onchange=e=>{audio.src=URL.createObjectURL(e.target.files[0]);lyric.textContent=e.target.files[0].name};
let imgs=[],n=0;
pics.onchange=e=>{imgs=[...e.target.files];show()};
function show(){if(!imgs.length)return;bg.style.opacity=0;setTimeout(()=>{bg.src=URL.createObjectURL(imgs[n]);bg.style.opacity=1;n=(n+1)%imgs.length},700)}
setInterval(show,6000);
lrc.onchange=async e=>{let t=await e.target.files[0].text();let a=[...t.matchAll(/\[(\d+):(\d+).*?\](.*)/g)];audio.ontimeupdate=()=>{let x=a.filter(v=>v[1]*60+v[2]<=audio.currentTime).pop();if(x)lyric.textContent=x[3]}};
for(let box of [l,r])for(let i=0;i<16;i++)box.innerHTML+="<div class='wave'></div>";
let timer;document.body.onclick=e=>{if(e.target.tagName!="LABEL"&&e.target.tagName!="BUTTON"&&e.target.tagName!="INPUT"){ui.classList.remove("hide");clearTimeout(timer);timer=setTimeout(()=>ui.classList.add("hide"),3000)}};
</script></body></html>
